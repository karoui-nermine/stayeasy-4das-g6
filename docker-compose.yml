services:
  postgres:
    image: postgres:16
    environment: { POSTGRES_USER: stayeasy, POSTGRES_PASSWORD: stayeasy }
    ports: ["5432:5432"]
    volumes: ["./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql"]
    healthcheck: { test: ["CMD-SHELL","pg_isready -U stayeasy"], interval: 5s, retries: 20 }
  mysql:
    image: mysql:8.4
    environment: { MYSQL_ROOT_PASSWORD: root }
    ports: ["3306:3306"]
    volumes: ["./infra/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql"]
    healthcheck: { test: ["CMD","mysqladmin","ping","-h","localhost","-proot"], interval: 5s, retries: 30 }
  rabbitmq:
    image: rabbitmq:3.13-management
    ports: ["5672:5672","15672:15672"]
    healthcheck: { test: ["CMD","rabbitmq-diagnostics","-q","ping"], interval: 10s, retries: 20 }
  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    command: start-dev --import-realm
    environment: { KEYCLOAK_ADMIN: admin, KEYCLOAK_ADMIN_PASSWORD: admin }
    ports: ["8180:8080"]
    volumes: ["./infra/keycloak/stayeasy-realm.json:/opt/keycloak/data/import/stayeasy-realm.json"]
  eureka:
    build: ./infra/eureka-server
    ports: ["8761:8761"]
  api-gateway:
    build: ./infra/api-gateway
    ports: ["8080:8080"]
    environment: { EUREKA_URL: "http://eureka:8761/eureka", KEYCLOAK_JWK: "http://keycloak:8080/realms/stayeasy/protocol/openid-connect/certs" }
    depends_on: [eureka, keycloak]
  accommodation-service:
    build: ./backend/accommodation-service
    ports: ["8081:8081"]
    environment: { DB_URL: "jdbc:postgresql://postgres:5432/accommodation_db", EUREKA_URL: "http://eureka:8761/eureka", RABBIT_HOST: rabbitmq }
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      eureka: { condition: service_started }
  reservation-service:
    build: ./backend/reservation-service
    ports: ["8082:8082"]
    environment: { DB_URL: "jdbc:postgresql://postgres:5432/reservation_db", EUREKA_URL: "http://eureka:8761/eureka", RABBIT_HOST: rabbitmq }
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      eureka: { condition: service_started }
  maintenance-service:
    build: ./backend/maintenance-service
    ports: ["8083:8083"]
    environment: { DB_URL: "jdbc:mysql://mysql:3306/maintenance_db?allowPublicKeyRetrieval=true&useSSL=false", EUREKA_URL: "http://eureka:8761/eureka", RABBIT_HOST: rabbitmq }
    depends_on:
      mysql: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      eureka: { condition: service_started }
  colocation-service:
    build: ./backend/colocation-service
    ports: ["8084:8084"]
    environment: { DB_URL: "jdbc:mysql://mysql:3306/colocation_db?allowPublicKeyRetrieval=true&useSSL=false", EUREKA_URL: "http://eureka:8761/eureka", RABBIT_HOST: rabbitmq }
    depends_on:
      mysql: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      eureka: { condition: service_started }
  facturation-service:
    build: ./backend/facturation-service
    ports: ["8085:8085"]
    environment: { DB_URL: "jdbc:postgresql://postgres:5432/facturation_db", EUREKA_URL: "http://eureka:8761/eureka", RABBIT_HOST: rabbitmq }
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      eureka: { condition: service_started }
  notification-service:
    build: ./backend/notification-service
    ports: ["8086:8086"]
    environment: { DB_URL: "jdbc:mysql://mysql:3306/notification_db?allowPublicKeyRetrieval=true&useSSL=false", EUREKA_URL: "http://eureka:8761/eureka", RABBIT_HOST: rabbitmq }
    depends_on:
      mysql: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      eureka: { condition: service_started }
  user-service:
    build: ./backend/user-service
    ports: ["8087:8087"]
    environment: { DB_URL: "postgresql://stayeasy:stayeasy@postgres:5432/user_db", RABBIT_URL: "amqp://guest:guest@rabbitmq:5672", EUREKA_HOST: eureka, EUREKA_INSTANCE_HOST: user-service }
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      eureka: { condition: service_started }
  frontend:
    build: ./frontend
    ports: ["3000:80"]
    depends_on: [api-gateway]
