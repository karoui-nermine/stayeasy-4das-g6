server.port=${PORT:8082}
spring.application.name=reservation

# Base de donnees
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/reservation_db}
spring.datasource.username=${DB_USER:stayeasy}
spring.datasource.password=${DB_PASSWORD:stayeasy}
spring.jpa.hibernate.ddl-auto=update

# RabbitMQ
spring.rabbitmq.host=${RABBIT_HOST:localhost}

# Swagger / OpenAPI
springdoc.api-docs.path=/v3/api-docs

# Actuator
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# Eureka
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka}
eureka.instance.prefer-ip-address=true

# Info
info.app.name=Reservation
info.app.description=Microservice Reservation - StayEasy
info.app.version=1.0.0
