server.port=${PORT:8086}
spring.application.name=notification

# Base de donnees
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/notification_db?allowPublicKeyRetrieval=true&useSSL=false}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.jpa.hibernate.ddl-auto=update

# RabbitMQ
spring.rabbitmq.host=${RABBIT_HOST:localhost}

# Swagger / OpenAPI
springdoc.api-docs.path=/v3/api-docs

# Actuator
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# Eureka
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka}
eureka.instance.prefer-ip-address=true

# Info
info.app.name=Notification
info.app.description=Microservice Notification - StayEasy
info.app.version=1.0.0
